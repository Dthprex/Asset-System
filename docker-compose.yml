services:
  asset-tracker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cosmetics-lk-asset-system
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - TZ=Asia/Colombo
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      # Persistent JSON fleet database storage
      - ./src/data:/app/src/data
      # Persistent uploaded invoices, bills, and hardware photos
      - ./public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
